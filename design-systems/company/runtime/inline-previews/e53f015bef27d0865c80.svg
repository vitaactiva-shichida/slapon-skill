<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" data-preview="true"><style>@font-face{font-family:"Arimo";src:url("../assets/fonts/Arimo.ttf");font-weight:100 900;font-style:normal}
@font-face{font-family:"Noto Sans JP";src:url("../assets/fonts/NotoSansJP.ttf");font-weight:100 900;font-style:normal}</style><title>半透明のグループ面と不透明な説明ノード</title><defs /><rect x="0" y="0" fill="#FFFFFF" width="1600" height="600" /><rect x="80" y="90" rx="12" fill-opacity="0.12" fill="#1457D9" width="1440" height="350" /><rect x="760" y="90" rx="12" fill-opacity="0.12" fill="#1457D9" width="760" height="350" /><rect x="160" y="150" rx="12" stroke-width="2" fill="#FFFFFF" stroke="#CCD0D5" width="480" height="210" /><line x1="640" y1="255" x2="960" y2="255" stroke-width="2" stroke="#1457D9" /><rect x="960" y="150" rx="12" stroke-width="2" fill="#FFFFFF" stroke="#CCD0D5" width="480" height="210" /><text x="192" y="208" fill="#17283F" font-family="Noto Sans JP" font-size="28" font-weight="700" text-anchor="start"><tspan x="192" dy="0">手前のノードは100%</tspan><tspan x="192" dy="42">背面の線を隠す</tspan></text><text x="992" y="208" fill="#17283F" font-family="Noto Sans JP" font-size="28" font-weight="700" text-anchor="start"><tspan x="992" dy="0">文字・輪郭は100%</tspan><tspan x="992" dy="42">塗りのalphaと分離</tspan></text><text x="80" y="506" fill="#17283F" font-family="Noto Sans JP" font-size="26" font-weight="400" text-anchor="start"><tspan x="80" dy="0">補助面12% → 接続線 → 不透明ノード → アイコン・文字</tspan></text></svg>