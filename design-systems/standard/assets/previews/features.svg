<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>独立した機能・特徴を詳しく説明する</title><rect width="1600" height="900" fill="#FFFFFF" /><text x="30" y="45" font-size="17" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="30" dy="0">SERVICE OVERVIEW</tspan></text><line fill="none" stroke="#6B7584" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" x1="217.0" x2="217.0" y1="28.0" y2="48.0" /><text x="238.0" y="45" font-size="20" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="238.0" dy="0">Slapon のサービス紹介</tspan></text><line fill="none" stroke="#CCD0D5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" x1="30" y1="68" x2="1570" y2="68" /><rect fill="#2356A8" x="30" y="67" width="64" height="3" rx="0" /><text x="80" y="156" font-size="42" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="80" dy="0">資料づくりを支える、4つの機能</tspan></text><text x="80" y="202" font-size="26" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="80" dy="0">構成から仕上げまで。資料作成に必要な作業を、ひとつの流れで支えます。</tspan></text><text x="1575" y="875" font-size="14" fill="#17283F" text-anchor="end" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="1575" dy="0">09</tspan></text><rect fill="#EAF0FA" x="80" y="232" width="704" height="276" rx="4" /><text x="104" y="286" font-size="30" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="104" dy="0">01  構成</tspan></text><text x="104" y="334" font-size="26" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="104" dy="0">伝える順番を組み立てる</tspan></text><text x="104" y="380" font-size="24" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="104" dy="0">目的と読み手に合わせて、入力した情報を整理。章立てと各</tspan><tspan x="104" dy="30">ページの要点をまとめ、結論と根拠がつながる順番に組み立</tspan><tspan x="104" dy="30">てます。</tspan></text><text x="104" y="478" font-size="16" fill="#6B7584" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="104" dy="0">出力例  章立て・ページごとの見出し</tspan></text><rect fill="#EAF0FA" x="816" y="232" width="704" height="276" rx="4" /><text x="840" y="286" font-size="30" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="840" dy="0">02  図解</tspan></text><text x="840" y="334" font-size="26" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="840" dy="0">情報の関係を見える形にする</tspan></text><text x="840" y="380" font-size="24" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="840" dy="0">文章に含まれる違いや流れを、比較表や工程図へ。情報同士</tspan><tspan x="840" dy="30">の関係に合う図解を選び、文章だけでは捉えにくい要点を、</tspan><tspan x="840" dy="30">ひと目で理解できる形にします。</tspan></text><text x="840" y="478" font-size="16" fill="#6B7584" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="840" dy="0">出力例  比較表・工程図・関係図</tspan></text><rect fill="#EAF0FA" x="80" y="540" width="704" height="276" rx="4" /><text x="104" y="594" font-size="30" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="104" dy="0">03  デザイン</tspan></text><text x="104" y="642" font-size="26" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="104" dy="0">ページ全体の見た目を揃える</tspan></text><text x="104" y="688" font-size="24" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="104" dy="0">見出しと本文の強弱、余白、図表の配置を調整。内容に合う</tspan><tspan x="104" dy="30">レイアウトを使い、ページをまたいでも読みやすさと統一感</tspan><tspan x="104" dy="30">が続く資料に整えます。</tspan></text><text x="104" y="786" font-size="16" fill="#6B7584" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="104" dy="0">出力例  共通スタイルのスライド</tspan></text><rect fill="#EAF0FA" x="816" y="540" width="704" height="276" rx="4" /><text x="840" y="594" font-size="30" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="840" dy="0">04  編集</tspan></text><text x="840" y="642" font-size="26" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="840" dy="0">PowerPoint で仕上げる</tspan></text><text x="840" y="688" font-size="24" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="840" dy="0">生成した初稿を、編集できる PowerPoint に出力。顧客名や</tspan><tspan x="840" dy="30">数値、注釈を自分で直し、用途に合わせて内容を確認しなが</tspan><tspan x="840" dy="30">ら最後の調整を行えます。</tspan></text><text x="840" y="786" font-size="16" fill="#6B7584" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="840" dy="0">出力例  編集可能な PowerPoint</tspan></text><g data-brand-slot="header">
<g>
