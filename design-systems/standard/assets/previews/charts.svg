<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>独立する推移と構成比を読み分ける</title><rect width="1600" height="900" fill="#FFFFFF" /><text x="30" y="45" font-size="20" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="30" dy="0">SERVICE SAMPLE</tspan></text><line fill="none" stroke="#6B7584" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" x1="218.0" x2="218.0" y1="28.0" y2="48.0" /><text x="239.0" y="45" font-size="20" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="239.0" dy="0">Slapon  •  AIとつくる資料作成</tspan></text><line fill="none" stroke="#CCD0D5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" x1="30" y1="68" x2="1570" y2="68" /><rect fill="#2356A8" x="30" y="67" width="64" height="3" rx="0" /><text x="80" y="156" font-size="42" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="80" dy="0">推移と構成比を、読み分ける。</tspan></text><text x="80" y="202" font-size="26" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="80" dy="0">資料の効果を捉えるには、時間とともに変わる指標と、ある時点の回答の内訳を分けて見ることが大切です。</tspan><tspan x="80" dy="39">左の折れ線グラフは初稿作成の効率の推移を示し、改善が続いているかを確認するための例です。</tspan><tspan x="80" dy="39">右の円グラフは初稿を使いたいという回答の構成比を示し、利用意向の分布を把握するための例です。</tspan><tspan x="80" dy="39">以下の数値はデザイン検討用のダミーデータです。推移と構成比を並べ、説明文とグラフの関係を確認できます。</tspan></text><text x="1575" y="875" font-size="14" fill="#17283F" text-anchor="end" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="1575" dy="0">10</tspan></text><text x="80" y="434" font-size="30" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="80" dy="0">初稿作成の効率が改善</tspan></text><text x="80" y="480" font-size="20" fill="#6B7584" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="80" dy="0">単位：%｜2026年1〜9月</tspan></text><line fill="none" stroke="#CCD0D5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" x1="128" y1="732.0" x2="712" y2="732.0" /><text x="112" y="734.0" font-size="18" fill="#6B7584" text-anchor="end" font-family="Arimo,Arial,sans-serif"><tspan x="112" dy="0">0</tspan></text><line fill="none" stroke="#CCD0D5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" x1="128" y1="630.0" x2="712" y2="630.0" /><text x="112" y="632.0" font-size="18" fill="#6B7584" text-anchor="end" font-family="Arimo,Arial,sans-serif"><tspan x="112" dy="0">50</tspan></text><line fill="none" stroke="#CCD0D5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" x1="128" y1="528.0" x2="712" y2="528.0" /><text x="112" y="530.0" font-size="18" fill="#6B7584" text-anchor="end" font-family="Arimo,Arial,sans-serif"><tspan x="112" dy="0">100</tspan></text><polyline fill="none" stroke="#2356A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="128.0,666.72 201.0,660.6 274.0,646.3199999999999 347.0,636.12 420.0,627.96 493.0,619.8 566.0,605.52 639.0,597.36 712.0,585.12" /><circle fill="#2356A8" cx="128.0" cy="666.72" r="4" /><text x="128.0" y="646.72" font-size="22" fill="#2356A8" text-anchor="middle" font-family="Arimo,Arial,sans-serif"><tspan x="128.0" dy="0">32</tspan></text><circle fill="#2356A8" cx="201.0" cy="660.6" r="4" /><text x="201.0" y="640.6" font-size="22" fill="#2356A8" text-anchor="middle" font-family="Arimo,Arial,sans-serif"><tspan x="201.0" dy="0">35</tspan></text><circle fill="#2356A8" cx="274.0" cy="646.3199999999999" r="4" /><text x="274.0" y="626.3199999999999" font-size="22" fill="#2356A8" text-anchor="middle" font-family="Arimo,Arial,sans-serif"><tspan x="274.0" dy="0">42</tspan></text><circle fill="#2356A8" cx="347.0" cy="636.12" r="4" /><text x="347.0" y="616.12" font-size="22" fill="#2356A8" text-anchor="middle" font-family="Arimo,Arial,sans-serif"><tspan x="347.0" dy="0">47</tspan></text><circle fill="#2356A8" cx="420.0" cy="627.96" r="4" /><text x="420.0" y="607.96" font-size="22" fill="#2356A8" text-anchor="middle" font-family="Arimo,Arial,sans-serif"><tspan x="420.0" dy="0">51</tspan></text><circle fill="#2356A8" cx="493.0" cy="619.8" r="4" /><text x="493.0" y="599.8" font-size="22" fill="#2356A8" text-anchor="middle" font-family="Arimo,Arial,sans-serif"><tspan x="493.0" dy="0">55</tspan></text><circle fill="#2356A8" cx="566.0" cy="605.52" r="4" /><text x="566.0" y="585.52" font-size="22" fill="#2356A8" text-anchor="middle" font-family="Arimo,Arial,sans-serif"><tspan x="566.0" dy="0">62</tspan></text><circle fill="#2356A8" cx="639.0" cy="597.36" r="4" /><text x="639.0" y="577.36" font-size="22" fill="#2356A8" text-anchor="middle" font-family="Arimo,Arial,sans-serif"><tspan x="639.0" dy="0">66</tspan></text><circle fill="#2356A8" cx="712.0" cy="585.12" r="4" /><text x="712.0" y="565.12" font-size="22" fill="#2356A8" text-anchor="middle" font-family="Arimo,Arial,sans-serif" font-weight="700"><tspan x="712.0" dy="0">72%</tspan></text><text x="128" y="768" font-size="20" fill="#6B7584" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="128" dy="0">1月</tspan></text><text x="712" y="768" font-size="20" fill="#6B7584" text-anchor="end" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="712" dy="0">9月</tspan></text><text x="80" y="804" font-size="16" fill="#6B7584" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="80" dy="0">効率の変化を示す検討用ダミー値</tspan></text><text x="832" y="434" font-size="30" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="832" dy="0">初稿を使いたいという回答</tspan></text><circle fill="none" cx="1168" cy="632" r="98" stroke-width="56" stroke="#D89B34" /><circle fill="none" cx="1168" cy="632" r="98" stroke-width="56" stroke-dasharray="375.6088176631956 240.14334244040379" transform="rotate(-90 1168 632)" stroke="#2356A8" /><text x="1168.0" y="648" font-size="38" fill="#2356A8" text-anchor="middle" font-family="Arimo,Arial,sans-serif" font-weight="700"><tspan x="1168.0" dy="0">61%</tspan></text><line fill="none" stroke="#6B7584" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="1280" y1="600" x2="1328" y2="576" /><text x="1344" y="560" font-size="24" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="1344" dy="0">使いたい</tspan><tspan x="1344" dy="36">61%</tspan></text><line fill="none" stroke="#6B7584" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="1056" y1="680" x2="1008" y2="704" /><text x="832" y="694" font-size="22" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="832" dy="0">まだわからない</tspan><tspan x="832" dy="32">39%</tspan></text><text x="832" y="804" font-size="16" fill="#6B7584" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="832" dy="0">直接ラベルの円グラフ・検討用ダミー値</tspan></text><text x="80" y="840" font-size="16" fill="#6B7584" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="80" dy="0">※ 左右は独立した検討用ダミーデータ。折れ線は推移、円グラフは構成比を示します。</tspan></text><g data-brand-slot="header">
