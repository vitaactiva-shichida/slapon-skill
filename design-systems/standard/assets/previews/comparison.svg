<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>同じ軸で選択肢を比較する</title><rect width="1600" height="900" fill="#FFFFFF" /><text x="30" y="45" font-size="20" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="30" dy="0">SERVICE SAMPLE</tspan></text><line fill="none" stroke="#6B7584" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" x1="218.0" x2="218.0" y1="28.0" y2="48.0" /><text x="239.0" y="45" font-size="20" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="239.0" dy="0">Slapon のサービス紹介</tspan></text><line fill="none" stroke="#CCD0D5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" x1="30" y1="68" x2="1570" y2="68" /><rect fill="#2356A8" x="30" y="67" width="64" height="3" rx="0" /><text x="80" y="156" font-size="42" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="80" dy="0">自社デザインで、繰り返し使える資料づくりへ</tspan></text><text x="80" y="202" font-size="26" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="80" dy="0">自社らしさ・修正のしやすさ・継続利用で、3つの制作方法を比較。</tspan></text><text x="1575" y="875" font-size="14" fill="#17283F" text-anchor="end" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="1575" dy="0">12</tspan></text><rect fill="#EAF0FA" x="80" y="240" width="284" height="64" rx="0" /><text x="104" y="282" font-size="26" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="104" dy="0">比較項目</tspan></text><rect fill="#EAF0FA" x="364" y="240" width="385.3333333333333" height="64" rx="0" /><text x="556.6666666666666" y="280" font-size="24" fill="#17283F" text-anchor="middle" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="556.6666666666666" dy="0">AIがパワポ作成</tspan></text><rect fill="#2356A8" x="749.3333333333333" y="240" width="385.3333333333333" height="64" rx="0" /><text x="941.9999999999999" y="280" font-size="24" fill="#FFFFFF" text-anchor="middle" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="941.9999999999999" dy="0">Slapon / スラポン</tspan></text><rect fill="#EAF0FA" x="1134.6666666666665" y="240" width="385.3333333333333" height="64" rx="0" /><text x="1327.3333333333333" y="280" font-size="24" fill="#17283F" text-anchor="middle" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="1327.3333333333333" dy="0">AIで画像生成</tspan></text><rect fill="#EAF0FA" x="144" y="304" width="220" height="96" rx="0" /><text x="168" y="344" font-size="24" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="168" dy="0">自社デザイン</tspan></text><rect fill="#FFFFFF" x="364" y="304" width="385.3333333333333" height="96" rx="0" /><text x="388" y="342" font-size="22" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="388" dy="0">AIで作ったと分かる</tspan><tspan x="388" dy="30">見た目になりやすい</tspan></text><rect fill="#EAF0FA" x="749.3333333333333" y="304" width="385.3333333333333" height="96" rx="0" /><text x="773.3333333333333" y="342" font-size="22" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="773.3333333333333" dy="0">既存資料をもとに</tspan><tspan x="773.3333333333333" dy="30">専用の制作キットをつくる</tspan></text><rect fill="#FFFFFF" x="1134.6666666666665" y="304" width="385.3333333333333" height="96" rx="0" /><text x="1158.6666666666665" y="342" font-size="22" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="1158.6666666666665" dy="0">配色・レイアウトを</tspan><tspan x="1158.6666666666665" dy="30">指示して画像を生成する</tspan></text><line fill="none" stroke="#CCD0D5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" x1="144" y1="400" x2="1520" y2="400" /><rect fill="#EAF0FA" x="144" y="400" width="220" height="96" rx="0" /><text x="168" y="440" font-size="24" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="168" dy="0">文字の修正</tspan></text><rect fill="#FFFFFF" x="364" y="400" width="385.3333333333333" height="96" rx="0" /><text x="388" y="438" font-size="22" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="388" dy="0">PowerPoint上で</tspan><tspan x="388" dy="30">文字を直接編集できる</tspan></text><rect fill="#EAF0FA" x="749.3333333333333" y="400" width="385.3333333333333" height="96" rx="0" /><text x="773.3333333333333" y="438" font-size="22" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="773.3333333333333" dy="0">生成後もPowerPointで</tspan><tspan x="773.3333333333333" dy="30">文字・数値を編集できる</tspan></text><rect fill="#FFFFFF" x="1134.6666666666665" y="400" width="385.3333333333333" height="96" rx="0" /><text x="1158.6666666666665" y="438" font-size="22" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="1158.6666666666665" dy="0">画像内の文字はパワポで</tspan><tspan x="1158.6666666666665" dy="30">直接編集できない</tspan></text><line fill="none" stroke="#CCD0D5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" x1="144" y1="496" x2="1520" y2="496" /><rect fill="#EAF0FA" x="144" y="496" width="220" height="96" rx="0" /><text x="168" y="536" font-size="24" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="168" dy="0">繰り返しの制作</tspan></text><rect fill="#FFFFFF" x="364" y="496" width="385.3333333333333" height="96" rx="0" /><text x="388" y="534" font-size="22" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="388" dy="0">作るたびにデザインが変わる</tspan><tspan x="388" dy="30">自社らしさを揃えにくい</tspan></text><rect fill="#EAF0FA" x="749.3333333333333" y="496" width="385.3333333333333" height="96" rx="0" /><text x="773.3333333333333" y="534" font-size="22" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="773.3333333333333" dy="0">共通ルールとパーツを</tspan><tspan x="773.3333333333333" dy="30">専用キットで繰り返し使う</tspan></text><rect fill="#FFFFFF" x="1134.6666666666665" y="496" width="385.3333333333333" height="96" rx="0" /><text x="1158.6666666666665" y="534" font-size="22" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="1158.6666666666665" dy="0">作るたびに見た目を</tspan><tspan x="1158.6666666666665" dy="30">確認・調整する</tspan></text><line fill="none" stroke="#CCD0D5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" x1="144" y1="592" x2="1520" y2="592" /><rect fill="#EAF0FA" x="144" y="592" width="220" height="96" rx="0" /><text x="168" y="632" font-size="24" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="168" dy="0">品質の確認</tspan></text><rect fill="#FFFFFF" x="364" y="592" width="385.3333333333333" height="96" rx="0" /><text x="388" y="630" font-size="22" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="388" dy="0">AIの出力を確認し</tspan><tspan x="388" dy="30">見た目を手直しする</tspan></text><rect fill="#EAF0FA" x="749.3333333333333" y="592" width="385.3333333333333" height="96" rx="0" /><text x="773.3333333333333" y="630" font-size="22" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="773.3333333333333" dy="0">デザイナーの品質確認と</tspan><tspan x="773.3333333333333" dy="30">異なる原稿での生成検証</tspan></text><rect fill="#FFFFFF" x="1134.6666666666665" y="592" width="385.3333333333333" height="96" rx="0" /><text x="1158.6666666666665" y="630" font-size="22" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="1158.6666666666665" dy="0">生成した画像を</tspan><tspan x="1158.6666666666665" dy="30">自分たちで確認する</tspan></text><line fill="none" stroke="#CCD0D5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" x1="144" y1="688" x2="1520" y2="688" /><rect fill="#EAF0FA" x="144" y="688" width="220" height="96" rx="0" /><text x="168" y="728" font-size="24" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="168" dy="0">導入・改善</tspan></text><rect fill="#FFFFFF" x="364" y="688" width="385.3333333333333" height="96" rx="0" /><text x="388" y="726" font-size="22" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="388" dy="0">指示文や生成結果を</tspan><tspan x="388" dy="30">自分たちで調整する</tspan></text><rect fill="#EAF0FA" x="749.3333333333333" y="688" width="385.3333333333333" height="96" rx="0" /><text x="773.3333333333333" y="726" font-size="22" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="773.3333333333333" dy="0">登録・使い方の支援と</tspan><tspan x="773.3333333333333" dy="30">納品後30日間の無料改善</tspan></text><rect fill="#FFFFFF" x="1134.6666666666665" y="688" width="385.3333333333333" height="96" rx="0" /><text x="1158.6666666666665" y="726" font-size="22" fill="#17283F" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="1158.6666666666665" dy="0">指示文や生成結果を</tspan><tspan x="1158.6666666666665" dy="30">自分たちで調整する</tspan></text><line fill="none" stroke="#CCD0D5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" x1="144" y1="784" x2="1520" y2="784" /><rect fill="#EAF0FA" x="80" y="304" width="64" height="96" rx="0" /><text x="112.0" y="342.0" font-size="20" fill="#17283F" text-anchor="middle" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="112.0" dy="0">設</tspan><tspan x="112.0" dy="28">計</tspan></text><rect fill="#EAF0FA" x="80" y="400" width="64" height="192" rx="0" /><text x="112.0" y="486.0" font-size="20" fill="#17283F" text-anchor="middle" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="112.0" dy="0">制</tspan><tspan x="112.0" dy="28">作</tspan></text><rect fill="#EAF0FA" x="80" y="592" width="64" height="192" rx="0" /><text x="112.0" y="678.0" font-size="20" fill="#17283F" text-anchor="middle" font-family="Noto Sans JP,Arial,sans-serif" font-weight="700"><tspan x="112.0" dy="0">運</tspan><tspan x="112.0" dy="28">用</tspan></text><text x="80" y="816" font-size="16" fill="#6B7584" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="80" dy="0">※AIによる制作で起こり得る課題を比較。出力の編集性や品質はツール・設定によって異なります。</tspan></text><text x="80" y="840" font-size="16" fill="#6B7584" text-anchor="start" font-family="Noto Sans JP,Arial,sans-serif"><tspan x="80" dy="0">※スラポンも写真・複雑な図版は画像／SVGで配置。編集範囲は制作前に確認します。</tspan></text><g data-brand-slot="header">
