<svg xmlns="http://www.w3.org/2000/svg" width="1600.0" height="900.0" viewBox="0 0 1600 900"><title>type-scale</title><g font-family="Noto Sans JP, Hiragino Sans, Arial, sans-serif"><rect x="0" y="0" width="1600" height="900" fill="var(--p-background,#FFFFFF)"/><text x="80" y="98" fill="var(--p-text,#17283F)" font-size="42" font-weight="700">文字の階層を、役割でそろえる。</text><text x="80" y="166" fill="var(--p-muted,#6B7584)" font-size="22" font-weight="400">T01 / 本文タイトル 42px · Bold / 行送り50px</text><text x="80" y="236" fill="var(--p-text,#17283F)" font-size="30" font-weight="700">小見出し：関係とまとまりを示す</text><text x="1160" y="236" fill="var(--p-muted,#6B7584)" font-size="22" font-weight="400">30px / 700</text><text x="80" y="346" fill="var(--p-text,#17283F)" font-size="26" font-weight="400">本文：説明と条件を残しながら、読みやすく組む。</text><text x="1160" y="346" fill="var(--p-muted,#6B7584)" font-size="22" font-weight="400">26px / 400</text><text x="80" y="456" fill="var(--p-text,#17283F)" font-size="22" font-weight="400">図表ラベル：系列名・単位・期間を対応させる</text><text x="1160" y="456" fill="var(--p-muted,#6B7584)" font-size="22" font-weight="400">22px / 400</text><text x="80" y="566" fill="var(--p-text,#17283F)" font-size="16" font-weight="400">出典・注記：補足に限って使う。</text><text x="1160" y="566" fill="var(--p-muted,#6B7584)" font-size="22" font-weight="400">16px / 400</text><text x="80" y="716" fill="var(--p-text,#17283F)" font-size="32" font-weight="400">Noto Sans JP  /  あいうえお　漢字・かな</text><text x="80" y="786" fill="var(--p-text,#17283F)" font-size="32" font-weight="400" font-family="Arimo, Arial, sans-serif">Arimo  /  Business 2026 — 0123456789</text></g></svg>