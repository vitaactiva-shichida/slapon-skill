<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><ns0:title>図解部品の組み合わせ</ns0:title><ns0:rect width="1600" height="700" fill="#FFFFFF" /><ns0:g font-family="Noto Sans JP,Arial,sans-serif"><ns0:text x="80" y="78" font-size="34" fill="var(--p-text,#17283F)" font-weight="700">図解部品の組み合わせ</ns0:text><ns0:text x="80" y="126" font-size="22" fill="var(--p-muted,#6B7584)">ひとつの主張に必要な部品だけを選び、要素数と原稿量に合わせて配置する</ns0:text><ns0:text x="80" y="190" font-size="25" fill="var(--p-text,#17283F)" font-weight="700">P01 説明カード</ns0:text><ns0:rect x="80" y="215" width="370" height="180" rx="4" fill="var(--p-sub,#EAF0FA)" /><ns0:text x="104" y="260" font-size="27" fill="var(--p-text,#17283F)" font-weight="700">見出し</ns0:text><ns0:text x="104" y="308" font-size="24" fill="var(--p-text,#17283F)">説明文 / 内側24</ns0:text><ns0:text x="550" y="190" font-size="25" fill="var(--p-text,#17283F)" font-weight="700">P07 ノードと接続</ns0:text><ns0:rect x="550" y="240" width="150" height="110" rx="4" fill="var(--p-sub,#EAF0FA)" /><ns0:text x="574" y="303" font-size="22" fill="var(--p-text,#17283F)" font-weight="700">工程 1</ns0:text><ns0:line x1="704" y1="295" x2="734" y2="295" stroke="var(--p-main,#2356A8)" stroke-width="2" /><ns0:path d="M726 290 L734 295 L726 300" fill="none" stroke="var(--p-main,#2356A8)" stroke-width="2" stroke-linejoin="round" /><ns0:rect x="740" y="240" width="150" height="110" rx="4" fill="var(--p-sub,#EAF0FA)" /><ns0:text x="764" y="303" font-size="22" fill="var(--p-text,#17283F)" font-weight="700">工程 2</ns0:text><ns0:line x1="894" y1="295" x2="924" y2="295" stroke="var(--p-main,#2356A8)" stroke-width="2" /><ns0:path d="M916 290 L924 295 L916 300" fill="none" stroke="var(--p-main,#2356A8)" stroke-width="2" stroke-linejoin="round" /><ns0:rect x="930" y="240" width="150" height="110" rx="4" fill="var(--p-comparisonMain,#2356A8)" /><ns0:text x="954" y="303" font-size="22" fill="var(--p-white,#FFFFFF)" font-weight="700">工程 3</ns0:text><ns0:text x="1200" y="190" font-size="25" fill="var(--p-text,#17283F)" font-weight="700">P05 数値</ns0:text><ns0:text x="1200" y="290" font-size="80" fill="var(--p-primaryInk,#2356A8)" font-weight="700" font-family="Arimo,Arial,sans-serif">72%</ns0:text><ns0:text x="1200" y="340" font-size="22" fill="var(--p-muted,#6B7584)">比較元・期間を添える</ns0:text><ns0:text x="80" y="480" font-size="25" fill="var(--p-text,#17283F)" font-weight="700">P06 写真・図版</ns0:text><ns0:rect x="80" y="508" width="370" height="115" rx="4" fill="var(--p-sub,#EAF0FA)" /><ns0:text x="104" y="574" font-size="23" fill="var(--p-text,#17283F)">比率を保持してトリミング</ns0:text><ns0:text x="550" y="480" font-size="25" fill="var(--p-text,#17283F)" font-weight="700">P04 中心と周辺</ns0:text><ns0:circle cx="705" cy="567" r="78" fill="var(--p-conceptRingOuter,#E8EDF6)" /><ns0:circle cx="705" cy="567" r="66" fill="var(--p-conceptRingInner,#DDE5F2)" /><ns0:circle cx="705" cy="567" r="52" fill="var(--p-main,#2356A8)" /><ns0:text x="679" y="576" font-size="22" fill="var(--p-white,#FFFFFF)" font-weight="700">中心</ns0:text><ns0:line x1="790" y1="567" x2="875" y2="567" stroke="var(--p-main,#2356A8)" stroke-width="2" /><ns0:circle cx="920" cy="567" r="42" fill="var(--p-white,#FFFFFF)" stroke="#969696" stroke-width="1.5" /><ns0:text x="898" y="575" font-size="20" fill="var(--p-text,#17283F)">周辺</ns0:text><ns0:text x="1200" y="480" font-size="25" fill="var(--p-text,#17283F)" font-weight="700">P08 比較</ns0:text><ns0:rect x="1200" y="508" width="140" height="52" rx="4" fill="var(--p-sub,#EAF0FA)" /><ns0:rect x="1344" y="508" width="176" height="52" rx="4" fill="var(--p-comparisonMain,#2356A8)" /><ns0:text x="1220" y="544" font-size="20" fill="var(--p-text,#17283F)">共通軸</ns0:text><ns0:text x="1362" y="544" font-size="20" fill="var(--p-white,#FFFFFF)">注目する列</ns0:text><ns0:text x="1200" y="604" font-size="22" fill="var(--p-text,#17283F)">同じ基準・単位・行高</ns0:text></ns0:g></ns0:svg>