<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><title>図解の色・透明度</title><rect width="1600" height="700" fill="#FFFFFF"/><g font-family="Noto Sans JP,Arial,sans-serif"><text x="80" y="78" font-size="34" fill="var(--p-text,#17283F)" font-weight="700">図解の色・透明度</text><text x="80" y="126" font-size="22" fill="var(--p-muted,#6B7584)">図解の淡色面は、背景との合成に依存しない色役割で指定</text><rect x="80" y="190" width="336" height="120" rx="4" fill="var(--p-sub,#EAF0FA)" /><text x="80" y="352" font-size="22" fill="var(--p-text,#17283F)">グループ面 / sub</text><text x="80" y="390" font-size="22" fill="var(--p-muted,#6B7584)">不透明度100%</text><rect x="448" y="190" width="336" height="120" rx="4" fill="var(--p-main,#2356A8)" /><text x="448" y="352" font-size="22" fill="var(--p-text,#17283F)">主役・流れ / main</text><text x="448" y="390" font-size="22" fill="var(--p-muted,#6B7584)">不透明度100%</text><rect x="816" y="190" width="336" height="120" rx="4" fill="var(--p-comparisonMain,#2356A8)" /><text x="816" y="352" font-size="22" fill="var(--p-text,#17283F)">白文字の面 / comparisonMain</text><text x="816" y="390" font-size="22" fill="var(--p-muted,#6B7584)">不透明度100%</text><rect x="1184" y="190" width="336" height="120" rx="4" fill="var(--p-accent,#D89B34)" /><text x="1184" y="352" font-size="22" fill="var(--p-text,#17283F)">強調の一点 / accent</text><text x="1184" y="390" font-size="22" fill="var(--p-muted,#6B7584)">不透明度100%</text><text x="80" y="470" font-size="25" fill="var(--p-text,#17283F)" font-weight="700">装飾だけに使う透明度（白背景にmainを重ねた例）</text><rect x="80" y="510" width="336" height="80" rx="4" fill="var(--p-main,#2356A8)" fill-opacity="0.1"/><text x="80" y="638" font-size="20" fill="var(--p-muted,#6B7584)">10%：文字・接続線には適用しない</text><rect x="448" y="510" width="336" height="80" rx="4" fill="var(--p-main,#2356A8)" fill-opacity="0.2"/><text x="448" y="638" font-size="20" fill="var(--p-muted,#6B7584)">20%：文字・接続線には適用しない</text><rect x="816" y="510" width="336" height="80" rx="4" fill="var(--p-main,#2356A8)" fill-opacity="0.35"/><text x="816" y="638" font-size="20" fill="var(--p-muted,#6B7584)">35%：文字・接続線には適用しない</text><text x="1184" y="550" font-size="23" fill="var(--p-text,#17283F)">透かしロゴ40%は</text><text x="1184" y="590" font-size="23" fill="var(--p-text,#17283F)">D01・D02の個別規定</text></g></svg>