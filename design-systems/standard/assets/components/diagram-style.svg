<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><title>図解の形・線・アイコン</title><rect width="1600" height="700" fill="#FFFFFF"/><g font-family="Noto Sans JP,Arial,sans-serif"><text x="80" y="78" font-size="34" fill="var(--p-text,#17283F)" font-weight="700">図解の形・線・アイコン</text><text x="80" y="126" font-size="22" fill="var(--p-muted,#6B7584)">フラットな面、控えめな角丸、線画アイコン。意味のない影・立体・グラデーションを加えない</text><rect x="80" y="200" width="420" height="240" rx="4" fill="var(--p-sub,#EAF0FA)" /><text x="104" y="248" font-size="30" fill="var(--p-text,#17283F)" font-weight="700">説明カード</text><text x="104" y="305" font-size="26" fill="var(--p-text,#17283F)">角丸4px / 影なし</text><text x="104" y="355" font-size="24" fill="var(--p-text,#17283F)">面だけでまとまりを示す</text><circle cx="650" cy="272" r="64" fill="var(--p-sub,#EAF0FA)"/><g fill="none" stroke="var(--p-main,#2356A8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="628" y="247" width="44" height="50" rx="2"/><path d="M638 260H662 M638 272H662 M638 284H653"/></g><text x="560" y="385" font-size="23" fill="var(--p-text,#17283F)">線画48〜64px</text><text x="560" y="427" font-size="23" fill="var(--p-muted,#6B7584)">線幅2pxを基準</text><text x="850" y="220" font-size="25" fill="var(--p-text,#17283F)" font-weight="700">関連：矢印なし</text><line x1="850" y1="260" x2="1150" y2="260" stroke="var(--p-muted,#6B7584)" stroke-width="2" /><text x="850" y="340" font-size="25" fill="var(--p-text,#17283F)" font-weight="700">順序・移動：矢印あり</text><line x1="850" y1="380" x2="1150" y2="380" stroke="var(--p-main,#2356A8)" stroke-width="2" /><path d="M1142 375 L1150 380 L1142 385" fill="none" stroke="var(--p-main,#2356A8)" stroke-width="2" stroke-linejoin="round"/><text x="1230" y="270" font-size="22" fill="var(--p-text,#17283F)">関係名</text><text x="1230" y="312" font-size="22" fill="var(--p-muted,#6B7584)">線から8px以上</text><text x="80" y="552" font-size="26" fill="var(--p-text,#17283F)" font-weight="700">線の意味を統一</text><line x1="80" y1="595" x2="300" y2="595" stroke="var(--p-main,#2356A8)" stroke-width="2" /><text x="330" y="603" font-size="23" fill="var(--p-text,#17283F)">接続線2px。実線が基本。破線は未確定・予定など意味がある場合だけ。</text></g></svg>