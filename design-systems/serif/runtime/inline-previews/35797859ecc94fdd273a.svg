@font-face{font-family:"Noto Serif JP";src:url("../assets/fonts/NotoSerifJP.ttf");font-weight:100 900;font-style:normal}</style><title>Serifの基本造形と補助面の提案</title><defs /><rect x="0" y="0" fill="#F8F8F5" width="800" height="350" /><text x="30" y="36" fill="#101319" font-family="Libre Baskerville" font-size="18" font-weight="400" text-anchor="start"><tspan x="30" dy="0">Serif / Default</tspan></text><rect x="30" y="68" rx="0" stroke-width="0.5" fill="#F8F8F5" stroke="#CDCECE" width="350" height="190" /><rect x="42" y="86" rx="0" fill-opacity="1" fill="#E9EFFB" width="326" height="66" /><text x="52" y="109" fill="#101319" font-family="Noto Serif JP" font-size="13" font-weight="400" text-anchor="start"><tspan x="52" dy="0">構図と意味は共通</tspan><tspan x="52" dy="20">造形はSerifの規定へ</tspan></text><text x="42" y="185" fill="#343B45" font-family="Noto Sans JP" font-size="11" font-weight="400" text-anchor="start"><tspan x="42" dy="0">角丸 0px / 塗り 100%</tspan><tspan x="42" dy="18">内側 12px / 間隔 16px / 影なし</tspan></text><text x="30" y="289" fill="#343B45" font-family="Noto Sans JP" font-size="11" font-weight="400" text-anchor="start"><tspan x="30" dy="0">原本に合わせた直線的な輪郭</tspan></text><text x="420" y="36" fill="#101319" font-family="Libre Baskerville" font-size="18" font-weight="400" text-anchor="start"><tspan x="420" dy="0">Serif / Group tint</tspan></text><rect x="420" y="68" rx="0" stroke-width="0.5" fill="#F8F8F5" stroke="#CDCECE" width="350" height="190" /><rect x="436" y="86" rx="4" fill-opacity="0.08" fill="#1746D2" width="318" height="66" /><text x="446" y="109" fill="#101319" font-family="Noto Serif JP" font-size="13" font-weight="400" text-anchor="start"><tspan x="446" dy="0">構図と意味は共通</tspan><tspan x="446" dy="20">造形はSerifの規定へ</tspan></text><text x="436" y="185" fill="#343B45" font-family="Noto Sans JP" font-size="11" font-weight="400" text-anchor="start"><tspan x="436" dy="0">角丸 4px / 塗り 8%</tspan><tspan x="436" dy="18">内側 16px / 間隔 24px / 影なし</tspan></text><text x="420" y="289" f