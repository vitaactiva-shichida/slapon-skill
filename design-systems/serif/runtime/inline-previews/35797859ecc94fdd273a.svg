<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" data-preview="true"><style>@font-face{font-family:"Arimo";src:url("../assets/fonts/Arimo.ttf");font-weight:100 900;font-style:normal}
