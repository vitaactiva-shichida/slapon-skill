@font-face{font-family:"Noto Serif JP";src:url("../assets/fonts/NotoSerifJP.ttf");font-weight:100 900;font-style:normal}</style><title>半透明の補助面と不透明な説明ノード</title><defs /><rect x="0" y="0" fill="#F8F8F5" width="800" height="300" /><rect x="40" y="45" fill-opacity="0.08" fill="#1746D2" width="720" height="180" /><rect x="400" y="45" fill-opacity="0.08" fill="#1746D2" width="360" height="180" /><line x1="260" y1="130" x2="540" y2="130" stroke-width="1" stroke="#1746D2" /><rect x="80" y="80" stroke-width="0.5" fill="#F8F8F5" stroke="#CDCECE" width="220" height="100" /><rect x="500" y="80" stroke-width="0.5" fill="#F8F8F5" stroke="#CDCECE" width="220" height="100" /><text x="92" y="114" fill="#101319" font-family="Noto Serif JP" font-size="13" font-weight="400" text-anchor="start"><tspan x="92" dy="0">手前の面は100%</tspan><tspan x="92" dy="20">背面の線を隠す</tspan></text><text x="512" y="114" fill="#101319" font-family="Noto Serif JP" font-size="13" font-weight="400" text-anchor="start"><tspan x="512" dy="0">塗りだけ半透明</tspan><tspan x="512" dy="20">文字と線は100%</tspan></text><text x="40" y="257" fill="#343B45" font-family="Noto Sans JP" font-size="11" font-weight="400" text-anchor="start"><tspan x="40" dy="0">左：8% 1枚 ／ 右：8%を2枚重ね、合成15.36%相当</tspan></text></svg>