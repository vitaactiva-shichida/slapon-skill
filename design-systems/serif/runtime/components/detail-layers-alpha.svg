<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300"><style>@font-face{font-family:"Arimo";src:url("../assets/fonts/Arimo.ttf");font-weight:100 900;font-style:normal}
