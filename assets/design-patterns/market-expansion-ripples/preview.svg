<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-opacity=".07"/></filter></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#ffffff"/><g font-family="Hiragino Kaku Gothic ProN,Yu Gothic,Meiryo,sans-serif"><text x="72" y="60" font-size="15" fill="#858585" font-weight="500" text-anchor="start">DESIGN STUDY / DUMMY CONTENT</text><text x="72" y="127" font-size="36" fill="#242424" font-weight="700" text-anchor="start">小さな起点から、市場全体へ広げる</text><text x="72" y="177" font-size="21" fill="#737373" font-weight="400" text-anchor="start">ここに概要を記載します。要点と関係を、短い言葉で伝えます。</text><text x="72" y="320" font-size="31" fill="#333333" font-weight="700" text-anchor="start">ここに展開の方向性を</text><text x="72" y="367" font-size="31" fill="#333333" font-weight="700" text-anchor="start">二行で記載します。</text><text x="72" y="439" font-size="23" fill="#777777" font-weight="400" text-anchor="start">現在の領域を出発点として、</text><text x="72" y="481" font-size="23" fill="#777777" font-weight="400" text-anchor="start">隣接する機会へと展開します。</text><text x="72" y="523" font-size="23" fill="#777777" font-weight="400" text-anchor="start">拡大する範囲と目標を示します。</text><circle cx="1130" cy="487" r="290" fill="#f3f3f3" stroke="none" stroke-width="1"/><circle cx="1130" cy="582" r="195" fill="#e7e7e7" stroke="none" stroke-width="1"/><circle cx="1130" cy="631" r="146" fill="#d3d3d3" stroke="none" stroke-width="1"/><circle cx="1130" cy="677" r="100" fill="#b4b4b4" stroke="none" stroke-width="1"/><text x="1130" y="312" font-size="25" fill="#444444" font-weight="600" text-anchor="middle">市場全体</text><text x="1130" y="365" font-size="47" fill="#333333" font-weight="700" text-anchor="middle">1,000</text><text x="1130" y="671" font-size="24" fill="#333333" font-weight="600" text-anchor="middle">現在の領域</text><text x="1130" y="718" font-size="40" fill="#333333" font-weight="700" text-anch