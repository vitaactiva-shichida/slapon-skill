<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">成長パターン — グレースケール改訂版</title>
<desc id="desc">余白と文字階層を整えた三段階の成長イメージ。数値・文章はダミーで、円の大きさは数値の面積比を示していません。</desc>
<defs>
 <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f7f7f7"/><stop offset="1" stop-color="#e5e5e5"/></linearGradient>
 <linearGradient id="hero" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#282828"/><stop offset="1" stop-color="#626262"/></linearGradient>
 <linearGradient id="middle" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#898989"/><stop offset="1" stop-color="#aaaaaa"/></linearGradient>
 <clipPath id="bounds"><rect width="1600" height="900"/></clipPath>
</defs>
<g clip-path="url(#bounds)" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif">
 <rect width="1600" height="900" fill="#ffffff"/>
 <!-- A quiet ascending field joins the three milestones. -->
 <path d="M235 802 L194.17886585482358 661.8935650101996 L1219.0383199680807 9.292538873497506 H1600 V802 Z" fill="url(#band)"/>
 <path d="M194.17886585482358 661.8935650101996 L1219.0383199680807 9.292538873497506" fill="none" stroke="#d4d4d4" stroke-width="1.4"/>
 <path d="M235 802 H1536" stroke="#dadada" stroke-width="1.2"/>
 <!-- Editorial header -->
 <path d="M80 66 V96" stroke="#454545" stroke-width="4"/>
 <text x="101" y="89" font-size="21" font-weight="600" fill="#606060" letter-spacing="2">ダミーカテゴリー</text>
 <text x="78" y="182" font-size="50" font-weight="700" fill="#303030" letter-spacing="-1">ここにメインタイトルを入力</text>
 <g fill="#717171" font-size="25" font-weight="400">
  <text x="80" y="244">ここに説明文が入ります。内容の概要や背景を、</text>
  <text x="80" y="286">読み手に伝わる短い文章で記載します。</text>
 </g>
 <!-- Circles share a baseline; the largest is deliberately cropped. -->
 <circle cx="1450" cy="372" r="430" fill="url(#hero)"/>
 <circle transform="translate(-34.406779661017026 0)" cx="695" cy="602" r="200" fill="url(#middle)"/>
 <circle cx="235" cy="726" r="76" fill="#b8b8b8"/>
 <!-- Consistent narrow arrowheads with tapered stems -->
 <path d="M328 720 L466 652 L456 635 L519 640 L488 695 L479 678 Z" fill="#ffffff"/>
 <path d="M911 550 L1064 466 L1053 447 L1123 453 L1088 513 L1078 494 Z" fill="#ffffff"/>
 <!-- Align units separately, keeping the numbers dominant. -->
 <g fill="#ffffff">
  <g id="milestone-a" text-anchor="middle">
   <text x="233" y="719" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="600" letter-spacing="-2">10</text>
   <text x="235" y="748" font-size="17" fill="#f7f7f7">ダミー単位</text>
   <text x="235" y="775" font-size="14" fill="#f4f4f4">時点 A</text>
  </g>
  <g transform="translate(-34.406779661017026 0)" id="milestone-b" text-anchor="middle">
   <text x="695" y="493" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="4" fill="#eeeeee">PHASE 02</text>
   <text x="688" y="628" font-family="Arial,Helvetica,sans-serif" font-size="120" font-weight="600" letter-spacing="-5">50</text>
   <text x="695" y="673" font-size="23" fill="#f4f4f4">ダミー単位</text>
   <path d="M663 702 H727" stroke="#ffffff" stroke-opacity=".4"/>
   <text x="695" y="738" font-size="19" fill="#f5f5f5">時点 B · 目標</text>
  </g>
  <g id="milestone-c" text-anchor="middle">
   <text x="1335" y="265" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="5" fill="#d2d2d2">PHASE 03</text>
   <text x="1328" y="442" font-family="Arial,Helvetica,sans-serif" font-size="178" font-weight="600" letter-spacing="-9">150</text>
   <text x="1335" y="500" font-size="30" fill="#ededed">ダミー単位</text>
   <path d="M1294 538 H1376" stroke="#ffffff" stroke-opacity=".3"/>
   <text x="1335" y="584" font-size="24" fill="#dedede">時点 C · 目標</text>
  </g>
 </g>
 <text x="80" y="855" font-size="15" fill="#999999" letter-spacing=".3">成長イメージ ／ 数値・テキストはダミー</text>
 <text x="1520" y="855" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#999999">01</text>
</g>
</svg>
