<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="white"/><g font-family="Hiragino Kaku Gothic ProN,Yu Gothic,Meiryo,sans-serif"><text x="72" y="62" font-size="17" fill="#777777" font-weight="600" text-anchor="start">DUMMY CATEGORY</text><text x="72" y="128" font-size="38" fill="#262626" font-weight="700" text-anchor="start">土台となる価値観が、全体を支える</text><text x="72" y="282" font-size="32" fill="#333333" font-weight="700" text-anchor="start">ここに主張を記載します。</text><text x="72" y="338" font-size="23" fill="#707070" font-weight="400" text-anchor="start">三つの階層の関係を整理し、</text><text x="72" y="377" font-size="23" fill="#707070" font-weight="400" text-anchor="start">その土台となる考え方を強調します。</text><text x="72" y="416" font-size="23" fill="#707070" font-weight="400" text-anchor="start">ここに背景や意図を短く記載します。</text><path d="M1150 200 L1070 330 A80 18.4 0 0 0 1230 330 Z" fill="#e3e3e3" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M1070 377 L995 500 A155 35.65 0 0 0 1305 500 L1230 377 Z" fill="#bcbcbc" stroke="none" stroke-width="2" stroke-linejoin="round"/><ellipse cx="1150" cy="377" rx="80" ry="18.400000000000002" fill="#d1d1d1"/><path d="M995 589 L877 782 A273 62.790000000000006 0 0 0 1423 782 L1305 589 Z" fill="#505050" stroke="none" stroke-width="2" stroke-linejoin="round"/><ellipse cx="1150" cy="589" rx="155" ry="35.65" fill="#777777"/><path d="M800 290 H1110" fill="none" stroke="#999999" stroke-width="1.3" stroke-linejoin="round"/><text x="770" y="280" font-size="15" fill="#888888" font-weight="600" text-anchor="end">LAYER 01</text><text x="770" y="315" font-size="25" fill="#333333" font-weight="600" text-anchor="end">上位の概念</text><path d="M800 450 H1060" fill="none" stroke="#999999" stroke-width="1.3" stroke-linejoin="round"/><text x="770" y="440" font-size="15" fill="#888888" font-weight="600" text-anchor="end">LAYER 02</text><text x="770" y="475" font-size="25" fill="#333333" font-weight="600" text-anchor="end">中間の概念</text><path d="M800 711 H971" fill="none" stroke="#999999" stroke-width="1.3" stroke-linejoin="round"/><text x="770" y="701" font-size="15" fill="#888888" font-weight="600" text-anchor="end">LAYER 03</text><text x="770" y="736" font-size="25" fill="#333333" font-weight="600" text-anchor="end">土台の概念</text><text x="1150" y="716" font-size="26" fill="white" font-weight="600" text-anchor="middle">基盤となる価値観</text></g></svg>