<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="三要素の重なりと中心価値"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777777"/></marker></defs><g font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif"><rect width="1600" height="900" fill="#ffffff"/>
<text x="80" y="65" font-size="18" fill="#888888" font-weight="600" text-anchor="start">COMMON GROUND</text>
<text x="80" y="135" font-size="39" fill="#292929" font-weight="700" text-anchor="start">三つの強みが交わる、中心の価値</text>
<text x="80" y="185" font-size="22" fill="#777777" font-weight="400" text-anchor="start">ここに三つの要素を組み合わせる意義を記載します。</text>
<text x="84" y="375" font-size="35" fill="#333333" font-weight="700" text-anchor="start">それぞれの特徴を、</text>
<text x="84" y="430" font-size="35" fill="#333333" font-weight="700" text-anchor="start">共通の価値につなげる</text>
<text x="84" y="516" font-size="23" fill="#777777" font-weight="400" text-anchor="start">三つの要素と、その共通部分を示します。</text>
<text x="84" y="559" font-size="23" fill="#777777" font-weight="400" text-anchor="start">面積の大きさは数量を表しません。</text>
<text x="84" y="602" font-size="23" fill="#777777" font-weight="400" text-anchor="start">関係の意味を短い言葉で説明します。</text>
<circle cx="1170" cy="432" r="185" fill="#999999" fill-opacity=".22" stroke="#ffffff" stroke-width="4"/>
<circle cx="1042" cy="645" r="185" fill="#999999" fill-opacity=".22" stroke="#ffffff" stroke-width="4"/>
<circle cx="1298" cy="645" r="185" fill="#999999" fill-opacity=".22" stroke="#ffffff" stroke-width="4"/>
<text x="1170" y="382" font-size="30" fill="#555555" font-weight="700" text-anchor="middle">要素 A</text>
<text x="964" y="691" font-size="30" fill="#555555" font-weight="700" text-anchor="middle">要素 B</text>
<text x="1370" y="691" font-size="30" fill="#555555" font-weight="700" text-anchor="middle">要素 C</text>
<circle cx="1170" cy="563" r="63" fill="#444444" stroke="none" stroke-width="2"/>
<text x="1170" y="554" font-size="23" fill="#ffffff" font-weight="600" text-anchor="middle">共通の</text>
<text x="1170" y="586" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle">価値</text>
</g></svg>