<text x="865" y="577" font-size="19" fill="#888888" font-weight="400" text-anchor="start">観点 B：高</text>
<rect x="248" y="374" width="240" height="82" rx="6" fill="#eeeeee"/><text x="368.0" y="424.1" font-size="26" fill="#777777" font-weight="600" text-anchor="middle">領域 A</text>
