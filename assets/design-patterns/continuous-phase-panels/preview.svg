<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-opacity=".07"/></filter></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#ffffff"/><g font-family="Hiragino Kaku Gothic ProN,Yu Gothic,Meiryo,sans-serif"><text x="72" y="60" font-size="15" fill="#858585" font-weight="500" text-anchor="start">DESIGN STUDY / DUMMY CONTENT</text><text x="72" y="127" font-size="36" fill="#242424" font-weight="700" text-anchor="start">四つの段階で、理解を深める</text><text x="72" y="177" font-size="21" fill="#737373" font-weight="400" text-anchor="start">ここに概要を記載します。要点と関係を、短い言葉で伝えます。</text><rect x="72" y="310" width="260" height="365" rx="0" fill="#f0f0f0"/><text x="106" y="355" font-size="15" fill="#888888" font-weight="600" text-anchor="start">PHASE 01</text><text x="106" y="415" font-size="30" fill="#303030" font-weight="700" text-anchor="start">工程 A</text><text x="106" y="479" font-size="19" fill="#303030" font-weight="400" text-anchor="start">ここに目的を記載。</text><text x="106" y="514" font-size="19" fill="#303030" font-weight="400" text-anchor="start">要点を短く説明します。</text><rect x="332" y="310" width="350" height="365" rx="0" fill="#dfdfdf"/><text x="366" y="355" font-size="15" fill="#888888" font-weight="600" text-anchor="start">PHASE 02</text><text x="366" y="415" font-size="30" fill="#303030" font-weight="700" text-anchor="start">工程 B</text><text x="366" y="479" font-size="19" fill="#303030" font-weight="400" text-anchor="start">ここに工程の目的や、</text><text x="366" y="514" font-size="19" fill="#303030" font-weight="400" text-anchor="start">確認する内容を記載します。</text><text x="366" y="549" font-size="19" fill="#303030" font-weight="400" text-anchor="start">各段階の役割が伝わるよう、</text><text x="366" y="584" font-size="19" fill="#303030" font-weight="400" text-anchor="start">説明の長さを調整します。</text><rect x="682" y="310" width="500" height="365" rx="0" fill="#c8c8c8"/><text x="716" y="355" font-size="15" fill="#888888" font-weight="600" text-anchor="start">PHASE 03</text><text x="716" y="415" font-size="30" fill="#303030" font-weight="700" text-anchor="start">工程 C</text><text x="716" y="479" font-size="19" fill="#303030" font-weight="400" text-anchor="start">ここに工程の目的や、</text><text x="716" y="514" font-size="19" fill="#303030" font-weight="400" text-anchor="start">確認する内容を記載します。</text><text x="716" y="549" font-size="19" fill="#303030" font-weight="400" text-anchor="start">各段階の役割が伝わるよう、</text><text x="716" y="584" font-size="19" fill="#303030" font-weight="400" text-anchor="start">説明の長さを調整します。</text><rect x="1182" y="310" width="346" height="365" rx="0" fill="#444444"/><text x="1216" y="355" font-size="15" fill="#cccccc" font-weight="600" text-anchor="start">PHASE 04</text><text x="1216" y="415" font-size="30" fill="white" font-weight="700" text-anchor="start">工程 D</text><text x="1216" y="479" font-size="19" fill="white" font-weight="400" text-anchor="start">ここに工程の目的や、</text><text x="1216" y="514" font-size="19" fill="white" font-weight="400" text-anchor="start">確認する内容を記載します。</text><text x="1216" y="549" font-size="19" fill="white" font-weight="400" text-anchor="start">各段階の役割が伝わるよう、</text><text x="1216" y="584" font-size="19" fill="white" font-weight="400" text-anchor="start">説明の長さを調整します。</text><path d="M72 707 V726 H628 M972 726 H1528 V707" fill="none" stroke="#999999" stroke-width="1.5"/><text x="800" y="736" font-size="24" fill="#444444" font-weight="600" text-anchor="middle">全体の期間を記載</text><text x="72" y="861" font-size="13" fill="#999999" font-weight="400" text-anchor="start">REFERENCE PATTERN  /  数値・名称はダミー</text><path d="M332 356 L350 374 L332 392 Z" fill="#f0f0f0" stroke="none" stroke-width="1.5"/><path d="M682 356 L700 374 L682 392 Z" fill="#dfdfdf" stroke="none" stroke-width="1.5"/><path d="M1182 356 L1200 374 L1182 392 Z" fill="#c8c8c8" stroke="none" stroke-width="1.5"/></g></svg>