<text x="65" y="65" font-size="19" fill="#777777" font-weight="600" text-anchor="start">DUMMY CATEGORY</text>
<text x="65" y="129" font-size="38" fill="#303030" font-weight="700" text-anchor="start">ここに事業やプロダクトの見出しを入力</text>
<text x="75" y="290" font-size="26" fill="#777777" font-weight="600" text-anchor="start">DUMMY THEME</text>
<text x="72" y="389" font-size="57" fill="#303030" font-weight="700" text-anchor="start">ここに問いを入力</text>
<text x="75" y="514" font-size="29" fill="#444444" font-weight="600" text-anchor="start">ここに主張や結論を記載します。</text>
<text x="75" y="588" font-size="24" fill="#777777" font-weight="400" text-anchor="start">複数の入力がひとつに集まり、</text>
<text x="75" y="628" font-size="24" fill="#777777" font-weight="400" text-anchor="start">処理を経て複数の拠点へ広がる流れを、</text>
<text x="75" y="668" font-size="24" fill="#777777" font-weight="400" text-anchor="start">図と説明文を組み合わせて示します。</text>
