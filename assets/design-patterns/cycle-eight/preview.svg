<rect x="155" y="345" width="416" height="14" fill="#ffffff"/>
<text x="155" y="278" font-size="43" fill="#333333" text-anchor="start" font-weight="700">ここに見出しを、</text>
<text x="155" y="348" font-size="43" fill="#333333" text-anchor="start" font-weight="700">2行で入力します</text>
<text x="155" y="435" font-size="22" fill="#727272" text-anchor="start" font-weight="400">ここに説明文が入ります。図全体の</text>
<text x="155" y="472" font-size="22" fill="#727272" text-anchor="start" font-weight="400">意味や各ステップの関係について、</text>
<text x="155" y="509" font-size="22" fill="#727272" text-anchor="start" font-weight="400">読み手が理解しやすい言葉で説明</text>
<text x="155" y="546" font-size="22" fill="#727272" text-anchor="start" font-weight="400">します。段階ごとの内容を整理し、</text>
<text x="155" y="583" font-size="22" fill="#727272" text-anchor="start" font-weight="400">繰り返す流れを簡潔に伝えます。</text>
<text x="155" y="620" font-size="22" fill="#727272" text-anchor="start" font-weight="400">必要に応じて補足情報を加えて、</text>
<text x="155" y="657" font-size="22" fill="#727272" text-anchor="start" font-weight="400">図と文章の役割を分けて示します。</text>
