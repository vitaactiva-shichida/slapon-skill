<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="道筋と説明カード"><defs><linearGradient id="fade"><stop stop-color="#eeeeee"/><stop offset="1" stop-color="#777777"/></linearGradient><linearGradient id="reverse"><stop stop-color="#777777"/><stop offset="1" stop-color="#f5f5f5"/></linearGradient><linearGradient id="pale"><stop stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#dddddd"/></linearGradient><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".07"/></filter></defs><g font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif"><rect width="1600" height="900" fill="#ffffff"/>
