nchor="middle">観点 C</text><text x="845" y="267" font-size="27" fill="#333333" font-weight="700" text-anchor="start">それぞれの観点</text><rect x="818" y="289" width="710" height="334" rx="8" fill="#f5f5f5"/><circle cx="858" cy="325" r="15" fill="#777777" stroke="none" stroke-width="1"/><text x="858" y="331" font-size="17" fill="white" font-weight="600" text-anchor="middle">1</text><text x="891" y="332" font-size="23" fill="#444444" font-weight="600" text-anchor="start">観点 A</text><text x="850" y="372" font-size="20" fill="#777777" font-weight="400" text-anchor="start">ここに判断の基準や、確認する項目を記載します。</text><circle cx="858" cy="421" r="15" fill="#777777" stroke="none" stroke-width="1"/><text x="858" y="427" font-size="17" fill="white" font-weight="600" text-anchor="middle">2</text><text x="891" y="428" font-size="23" fill="#444444" font-weight="600" text-anchor="start">観点 B</text><text x="850" y="468" font-size="20" fill="#777777" font-weight="400" text-anchor="start">ここに判断の基準や、確認する項目を記載します。</text><circle cx="858" cy="517" r="15" fill="#777777" stroke="none" stroke-width="1"/><text x="858" y="523" font-size="17" fill="white" font-weight="600" text-anchor="middle">3</text><text x="891" y="524" font-size="23" fill="#444444" font-weight="600" text-anchor="start">観点 C</text><text x="850" y="564" font-size="20" fill="#777777" font-weight="400" text-anchor="start">ここに判断の基準や、確認する項目を記載します。</text><text x="845" y="680" font-size="27" fill="#333333" font-weight="700" text-anchor="start">運用のサイクル</text><rect x="818" y="706" width="710" height="91" rx="8" fill="#f5f5f5"/><text x="850" y="742" font-size="21" fill="#666666" font-weight="400" text-anchor="start">時点 A    ·····    目標の確認と設定</text><text x="850" y="776" font-size="21" fill="#666666" font-weight="400" text-anchor="start">時点 B    ·····    振り返りと次の行動</text><text x="72" y="861" font-size="13" fill="#999999" font-weight="400" text-anchor="start">REFERENCE PATTERN  /  数値・名称はダミー</text></g></svg>