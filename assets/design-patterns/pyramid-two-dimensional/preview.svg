t="400" text-anchor="start">ここに概念の説明を記載します。</text><text x="755" y="728" font-size="23" fill="#666666" font-weight="400" text-anchor="start">関係や役割が伝わるように要点をまとめます。</text><text x="72" y="854" font-size="15" fill="#999999" font-weight="400" text-anchor="start">二層の関係 ／ テキストはダミー</text></g></svg>